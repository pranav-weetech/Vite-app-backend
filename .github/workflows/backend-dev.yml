name: Backend Deploy (Main & Dev)

on:
  push:
    branches: 
      - main
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # Step 1: Print branch name
      - name: Print branch name
        run: echo "🔹 Branch triggered: ${{ github.ref_name }}"

      # Step 2: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 3: Print working directory
      - name: Show working directory
        run: echo "🔹 Working directory: $(pwd)"

      # Step 4: Navigate to backend folder
      - name: Go to backend directory
        run: |
          echo "🔹 Entering backend directory..."
          cd backend
          echo "🔹 Now inside: $(pwd)"

      # Step 5: Pull latest changes
      - name: Pull latest code
        run: |
          echo "🔹 Pulling latest changes..."
          cd backend
          git pull origin ${{ github.ref_name }}

      # Step 6: Install dependencies
      - name: Install NPM packages
        run: |
          echo "🔹 Installing dependencies..."
          cd backend
          npm install

      # Step 7: Stop old backend (if running)
      - name: Kill existing Node process
        run: |
          echo "🔹 Killing old backend on port 5000..."
          fuser -k 5000/tcp || true

      # Step 8: Start backend
      - name: Start backend
        run: |
          echo "🔹 Starting backend on port 5000..."
          cd backend
          nohup node index.js > backend.log 2>&1 &
          echo "🔹 Backend started successfully!"
