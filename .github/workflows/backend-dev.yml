name: Backend Deploy (Main + Dev)

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Print triggered branch
      - name: Print branch
        run: |
          echo "🚀 Branch triggered: ${{ github.ref_name }}"

      # 2️⃣ Select backend folder
      - name: Select deployment directory
        id: backend_dir
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=/home/ubuntu/backend" >> $GITHUB_OUTPUT
            echo "📌 Deploying MAIN backend"
          else
            echo "dir=/home/ubuntu/backend-runner" >> $GITHUB_OUTPUT
            echo "📌 Deploying DEV backend"
          fi

      # 3️⃣ Pull latest backend code manually
      - name: Pull latest backend code
        working-directory: ${{ steps.backend_dir.outputs.dir }}
        run: |
          echo "📥 Pulling latest code..."
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}
          git clean -fd
          echo "✔ Latest code synced"

      # 4️⃣ Install dependencies
      - name: Install dependencies
        working-directory: ${{ steps.backend_dir.outputs.dir }}
        run: |
          echo "📦 Installing npm packages..."
          npm ci
          echo "✔ Dependencies installed"

      # 5️⃣ Kill old backend process
      - name: Kill old backend
        run: |
          echo "🛑 Killing anything running on port 5000..."
          fuser -k 5000/tcp || true
          echo "✔ Port 5000 cleared"

      # 6️⃣ Start backend
      - name: Start backend
        working-directory: ${{ steps.backend_dir.outputs.dir }}
        run: |
          echo "🚀 Starting backend on port 5000..."
          nohup node index.js > backend.log 2>&1 &
          echo "✔ Backend started"

      # 7️⃣ Debug: show running Node processes
      - name: Check running Node processes
        run: |
          echo "🔎 Running node processes:"
          ps aux | grep node
          echo "🏁 Deployment complete"
