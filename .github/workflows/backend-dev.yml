name: Backend Deploy (Main + Dev)

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # Step 1: Print branch name
      - name: Print branch name
        run: echo "Branch triggered: ${{ github.ref_name }}"

      # Step 2: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 3: Choose deployment path based on branch
      - name: Select deployment path
        id: path
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=/home/ubuntu/backend" >> $GITHUB_OUTPUT
            echo "Deploying MAIN branch"
          else
            echo "dir=/home/ubuntu/backend-dev" >> $GITHUB_OUTPUT
            echo "Deploying DEV branch"
          fi

      # Step 4: Pull latest code
      - name: Pull latest code
        working-directory: ${{ steps.path.outputs.dir }}
        run: |
          echo "Syncing backend folder..."
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}
          git clean -fd
          echo "Latest code pulled."

      # Step 5: Install dependencies
      - name: Install dependencies
        working-directory: ${{ steps.path.outputs.dir }}
        run: |
          echo "Installing dependencies..."
          npm ci
          echo "Dependencies installed."

      # Step 6: Kill old backend
      - name: Kill old backend
        run: |
          echo "Killing port 5000..."
          fuser -k 5000/tcp || true
          echo "Old backend killed."

      # Step 7: Start backend
      - name: Start backend
        working-directory: ${{ steps.path.outputs.dir }}
        run: |
          echo "Starting backend..."
          nohup node index.js > backend.log 2>&1 &
          echo "Backend started."

      # Step 8: Debug processes
      - name: Check running processes
        run: |
          echo "Running node processes:"
          ps aux | grep node
          echo "Deployment complete."
