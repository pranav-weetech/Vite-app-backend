name: Backend Deploy (Main + Dev)

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Print branch name
      - name: Print branch name
        run: |
          echo "🚀 Branch triggered: ${{ github.ref_name }}"

      # 3️⃣ Print runner workspace
      - name: Print working directory
        run: |
          echo "👀 GitHub Actions workspace directory:"
          pwd
          echo "Files in workspace:"
          ls -lah

      # 4️⃣ Pull latest backend code
      - name: Pull latest backend code
        working-directory: ${{ github.workspace }}
        run: |
          echo "📥 Pulling latest code for branch: ${{ github.ref_name }}"
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}
          git clean -fd
          echo "✔ Latest code synced."

      # 5️⃣ Install dependencies
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          echo "📦 Installing npm packages..."
          npm ci
          echo "✔ Dependencies installed."

      # 6️⃣ Kill old backend process
      - name: Kill old backend
        run: |
          echo "🛑 Killing anything running on port 5000..."
          fuser -k 5000/tcp || true
          echo "✔ Port 5000 cleared."

      # 7️⃣ Start backend
      - name: Start backend
        working-directory: ${{ github.workspace }}
        run: |
          echo "🚀 Starting backend on port 5000..."
          nohup node index.js > backend.log 2>&1 &
          echo "✔ Backend started successfully!"

      # 8️⃣ Debug running processes
      - name: Check running Node processes
        run: |
          echo "🔎 Running node processes:"
          ps aux | grep node
          echo "🏁 Deployment complete."
