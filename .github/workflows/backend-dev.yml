name: Backend: Deploy for Main & Dev

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # ----------------------------------------------
      # 1️⃣ Identify branch
      # ----------------------------------------------
      - name: Print branch name
        run: |
          echo "🔍 Branch triggered: ${{ github.ref_name }}"

      # ----------------------------------------------
      # 2️⃣ Checkout repository
      # ----------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------
      # 3️⃣ Set backend directory based on branch
      # ----------------------------------------------
      - name: Select deployment path
        id: path
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "⭐ Deploying MAIN branch"
            echo "dir=/home/ubuntu/backend" >> $GITHUB_OUTPUT
          else
            echo "🟡 Deploying DEV branch"
            echo "dir=/home/ubuntu/backend-dev" >> $GITHUB_OUTPUT
          fi

      # ----------------------------------------------
      # 4️⃣ Pull latest changes (HARD RESET)
      # ----------------------------------------------
      - name: Pull latest backend code
        working-directory: ${{ steps.path.outputs.dir }}
        run: |
          echo "🔄 Syncing backend directory..."
          pwd
          echo "Fetching latest main branch..."
          git fetch origin ${{ github.ref_name }}
          echo "Resetting to remote branch..."
          git reset --hard origin/${{ github.ref_name }}
          echo "Cleaning old files..."
          git clean -fd
          echo "✅ Latest code pulled successfully."

      # ----------------------------------------------
      # 5️⃣ Install dependencies
      # ----------------------------------------------
      - name: Install packages
        working-directory: ${{ steps.path.outputs.dir }}
        run: |
          echo "📦 Installing npm dependencies..."
          npm ci
          echo "✅ Dependencies installed."

      # ----------------------------------------------
      # 6️⃣ Kill old backend process
      # ----------------------------------------------
      - name: Kill old backend
        run: |
          echo "🛑 Killing anything running on port 5000..."
          fuser -k 5000/tcp || true
          echo "✅ Old backend stopped."

      # ----------------------------------------------
      # 7️⃣ Start backend using nohup
      # ----------------------------------------------
      - name: Start backend
        working-directory: ${{ steps.path.outputs.dir }}
        run: |
          echo "🚀 Starting backend on port 5000..."
          nohup node index.js > backend.log 2>&1 &
          echo "✅ Backend started successfully."

      # ----------------------------------------------
      # 8️⃣ Debug: show running node processes
      # ----------------------------------------------
      - name: Check running backend process
        run: |
          echo "🔍 Showing running Node processes..."
          ps aux | grep node
          echo "🏁 Deployment completed successfully."
