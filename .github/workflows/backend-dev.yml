name: Backend Deploy (Main + Dev)

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: self-hosted
    steps:

      # 1️⃣ Print branch
      - name: Print branch
        run: echo "Branch triggered: ${{ github.ref_name }}"

      # 2️⃣ Select folder
      - name: Select deployment directory
        id: backend_dir
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=/home/ubuntu/backend" >> $GITHUB_OUTPUT
            echo "Deploying MAIN"
          else
            echo "dir=/home/ubuntu/backend-runner" >> $GITHUB_OUTPUT
            echo "Deploying DEV"
          fi

      # 3️⃣ Pull latest code manually
      - name: Pull latest backend code
        working-directory: ${{ steps.backend_dir.outputs.dir }}
        run: |
          echo "Pulling latest code..."
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}
          git clean -fd
          echo "✔ Code synced"

      # 4️⃣ Install dependencies
      - name: Install dependencies
        working-directory: ${{ steps.backend_dir.outputs.dir }}
        run: |
          echo "Installing packages..."
          npm ci
          echo "✔ Dependencies installed"

      # 5️⃣ Kill old backend
      - name: Kill old backend
        run: |
          echo "Killing port 5000..."
          fuser -k 5000/tcp || true
          echo "✔ Port cleared"

      # 6️⃣ Start backend
      - name: Start backend
        working-directory: ${{ steps.backend_dir.outputs.dir }}
        run: |
          echo "Starting backend..."
          nohup node index.js > backend.log 2>&1 &
          echo "✔ Backend started"

      # 7️⃣ Debug
      - name: Check running Node processes
        run: |
          echo "Running node processes:"
          ps aux | grep node
