name: Backend Deploy (Main & Dev)

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # 1️⃣ Checkout must ALWAYS be the first step
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Print branch name
      - name: Print branch name
        run: "Branch triggered: ${{ github.ref_name }}"

      # 3️⃣ Print working directory
      - name: Print working directory
        run: pwd

      # 4️⃣ Pull latest code
      - name: Pull latest backend code
        run: |
          cd backend
          echo "Pulling latest changes..."
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}

      # 5️⃣ Install dependencies
      - name: Install dependencies
        run: |
          cd backend
          echo "Installing dependencies..."
          npm install

      # 6️⃣ Kill old process
      - name: Kill existing backend
        run: |
          echo "Killing old backend on port 5000..."
          fuser -k 5000/tcp || true

      # 7️⃣ Start backend
      - name: Start backend
        run: |
          cd backend
          echo "Starting backend..."
          nohup node index.js > backend.log 2>&1 &
          echo "Backend started on port 5000"
