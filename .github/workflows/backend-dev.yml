name: Backend Deploy (Main & Dev)

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Print branch name
        run: echo "Branch triggered: ${{ github.ref_name }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print working directory
        run: echo "Working directory: $(pwd)"

      - name: Pull latest backend code
        run: |
          cd backend
          echo "Pulling latest changes..."
          git pull origin ${{ github.ref_name }}

      - name: Install dependencies
        run: |
          cd backend
          echo "Installing dependencies..."
          npm install

      - name: Kill existing backend on port 5000
        run: |
          echo "Killing old Node process..."
          fuser -k 5000/tcp || true

      - name: Start backend
        run: |
          cd backend
          echo "Starting backend..."
          nohup node index.js > backend.log 2>&1 &
          echo "Backend started on port 5000"
