name: Backend Deploy (Main + Dev)

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # 1️⃣ Checkout repository (required by Actions)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Print branch name
      - name: Print branch name
        run: |
          echo "🚀 Branch triggered: ${{ github.ref_name }}"

      # 3️⃣ Print current working directory
      - name: Print working directory
        run: |
          echo "👀 Current directory:"
          pwd

      # 4️⃣ Select deployment path based on branch
      - name: Select deployment directory
        id: backend_dir
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=/home/ubuntu/backend" >> $GITHUB_OUTPUT
            echo "📌 Deploying MAIN backend → /home/ubuntu/backend"
          else
            echo "dir=/home/ubuntu/backend-runner" >> $GITHUB_OUTPUT
            echo "📌 Deploying DEV backend → /home/ubuntu/backend-runner"
          fi

      # 5️⃣ Pull latest backend code (clone if directory doesn't exist)
      - name: Pull latest backend code
        run: |
          BACKEND_DIR="${{ steps.backend_dir.outputs.dir }}"
          echo "📥 Checking backend folder: $BACKEND_DIR"
          
          if [ ! -d "$BACKEND_DIR/.git" ]; then
            echo "📂 Directory does not exist or not a git repo. Cloning branch ${{ github.ref_name }}..."
            git clone --branch ${{ github.ref_name }} git@github.com:pranav-weetech/Vite-app-backend.git "$BACKEND_DIR"
          else
            echo "🔄 Directory exists, fetching latest changes..."
            cd "$BACKEND_DIR"
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            git clean -fd
          fi
          echo "✔ Backend code is up-to-date."

      # 6️⃣ Install dependencies
      - name: Install dependencies
        working-directory: ${{ steps.backend_dir.outputs.dir }}
        run: |
          echo "📦 Installing npm packages..."
          npm ci
          echo "✔ Dependencies installed."

      # 7️⃣ Kill any process on port 5000
      - name: Kill old backend
        run: |
          echo "🛑 Killing any process on port 5000..."
          fuser -k 5000/tcp || true
          echo "✔ Port 5000 cleared."

      # 8️⃣ Start backend
      - name: Start backend
        working-directory: ${{ steps.backend_dir.outputs.dir }}
        run: |
          echo "🚀 Starting backend on port 5000..."
          nohup node index.js > backend.log 2>&1 &
          echo "✔ Backend started successfully!"

      # 9️⃣ Debug running processes
      - name: Check running Node processes
        run: |
          echo "🔎 Currently running Node processes:"
          ps aux | grep node
          echo "🏁 Deployment complete."
