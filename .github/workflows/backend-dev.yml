name: Backend Deploy (Main + Dev) - Debug

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # 1️⃣ Checkout latest code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Print branch name
      - name: Print branch name
        run: |
          echo "🔹 Branch triggered: ${{ github.ref_name }}"

      # 3️⃣ Print current working directory
      - name: Print working directory
        run: |
          echo "👀 Current directory:"
          pwd
          echo "Listing files in the directory:"
          ls -la

      # 4️⃣ Select backend directory based on branch
      - name: Select deployment directory
        id: backend_dir
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "dir=/home/ubuntu/backend" >> $GITHUB_OUTPUT
            echo "📌 Deploying MAIN backend → /home/ubuntu/backend"
          else
            echo "dir=/home/ubuntu/backend-runner" >> $GITHUB_OUTPUT
            echo "📌 Deploying DEV backend → /home/ubuntu/backend-runner"

      # 5️⃣ Verify git repository
      - name: Verify git repository
        working-directory: ${{ steps.backend_dir.outputs.dir }}
        run: |
          echo "🔍 Checking if backend directory is a git repository..."
          if [ -d ".git" ]; then
            echo "✔ Git repository exists."
            git remote -v
          else
            echo "❌ Git repository not found in ${{ steps.backend_dir.outputs.dir }}"
            exit 1
          fi

      # 6️⃣ Pull latest backend code
      - name: Pull latest backend code
        working-directory: ${{ steps.backend_dir.outputs.dir }}
        run: |
          echo "📥 Pulling latest code from branch ${{ github.ref_name }}..."
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}
          git clean -fd
          echo "✔ Latest code synced."

      # 7️⃣ Install dependencies
      - name: Install dependencies
        working-directory: ${{ steps.backend_dir.outputs.dir }}
        run: |
          echo "📦 Installing npm packages..."
          npm ci
          echo "✔ Dependencies installed."

      # 8️⃣ Kill old backend process
      - name: Kill old backend
        run: |
          echo "🛑 Killing anything running on port 5000..."
          fuser -k 5000/tcp || true
          echo "✔ Port 5000 cleared."

      # 9️⃣ Start backend
      - name: Start backend
        working-directory: ${{ steps.backend_dir.outputs.dir }}
        run: |
          echo "🚀 Starting backend on port 5000..."
          nohup node index.js > backend.log 2>&1 &
          echo "✔ Backend started successfully!"

      # 🔟 Debug: show running node processes
      - name: Check running Node processes
        run: |
          echo "🔎 Running Node processes:"
          ps aux | grep node
          echo "🏁 Deployment completed successfully."
